version: '3.8'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: trv2app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: trv2
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://trv2app:changeme@db/trv2
      JWT_SECRET: change-me-to-a-random-secret
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
